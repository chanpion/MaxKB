[project]
name = "maxkb-backend"
version = "2.0.0"
description = "MaxKB backend refactored with FastAPI + SQLModel + Agno"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "agno[openai,anthropic,groq,ollama,aws,dashscope,litellm,postgres,pgvector,memory]>=1.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "arq>=0.12",
    "redis>=5.0",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "pgvector>=0.3",
    "uuid-utils>=0.11",
    "jieba>=0.42",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "charset-normalizer>=3.3",
    "polib>=1.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "bcrypt>=4.1",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
# Optional SDKs for the multimedia workflow nodes (image/tts/stt/video/ttv/mcp).
# Not required for the base service; install with `uv sync --extra multimedia`.
multimedia = [
    "mcp>=1.2",
    "elevenlabs>=1.2",
    "fal-client>=0.4",
    "replicate>=0.34",
    "luma>=0.1.3",
    "moviepy>=1.0",
    "opencv-python-headless>=4.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
